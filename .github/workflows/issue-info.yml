name: Issue Info

on:
  issues:

permissions: {}

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Show event details
        # Los valores controlados por el usuario (título, cuerpo) se pasan por env
        # y no con ${{ }} dentro del script, para evitar inyección de comandos.
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "Evento:  $EVENT_NAME"
          echo "Accion:  $ACTION"
          echo "Repo:    $REPO"
          echo "Actor:   $ACTOR"
          echo "Issue:   #$ISSUE_NUMBER - $ISSUE_TITLE"
          echo "Autor:   $ISSUE_AUTHOR"
          echo "Estado:  $ISSUE_STATE"
          echo "URL:     $ISSUE_URL"

      - name: Show full event payload
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: echo "$EVENT_JSON"
